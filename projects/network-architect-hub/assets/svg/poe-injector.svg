<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="poeCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- PoE Injector Box Body -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="380" height="210" rx="12" fill="url(#poeCase)" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Title & Brand -->
    <text x="30" y="35" font-family="Segoe UI, sans-serif" font-weight="900" font-size="16" fill="#f8fafc">PoE POWER INJECTOR</text>
    <text x="30" y="52" font-family="monospace" font-size="11" fill="#38bdf8">Passive 24V DC / 0.5A (Gigabit Rated)</text>

    <!-- Power LED -->
    <circle cx="330" cy="35" r="5" fill="#22c55e"><animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="315" y="52" font-size="8" fill="#94a3b8" font-family="monospace">PWR OK</text>

    <!-- RJ45 Port 1: LAN (Data Only to Switch/Router) -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="120" height="70" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <rect x="35" y="15" width="50" height="40" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="70" text-anchor="middle" font-size="10" fill="#f8fafc" font-weight="bold" font-family="monospace">LAN (DATA)</text>
      <text x="60" y="85" text-anchor="middle" font-size="8" fill="#94a3b8" font-family="sans-serif">من السويتش أو الميكروتك</text>
      <!-- Data icon -->
      <path d="M 50 25 L 70 25 M 50 35 L 70 35" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Center Arrow & Power Inserter Logic -->
    <g transform="translate(180, 105)">
      <!-- Lightning power icon -->
      <path d="M 10 5 L 0 20 L 8 20 L 2 35 L 18 15 L 10 15 Z" fill="#eab308"/>
      <text x="10" y="50" text-anchor="middle" font-size="8" fill="#eab308" font-family="monospace">+24V DC</text>
    </g>

    <!-- RJ45 Port 2: PoE (Data + 24V Power to Tower Radio) -->
    <g transform="translate(220, 80)">
      <rect x="0" y="0" width="120" height="70" rx="4" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
      <rect x="35" y="15" width="50" height="40" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="70" text-anchor="middle" font-size="10" fill="#eab308" font-weight="bold" font-family="monospace">POE (DATA + POWER)</text>
      <text x="60" y="85" text-anchor="middle" font-size="8" fill="#fef08a" font-family="sans-serif">إلى كابل البرج (النانو / الروكت)</text>
    </g>

    <!-- Grounding Terminal Lug -->
    <g transform="translate(30, 185)">
      <circle cx="10" cy="5" r="5" fill="#eab308" stroke="#78350f"/>
      <line x1="10" y1="12" x2="10" y2="18" stroke="#22c55e" stroke-width="2"/>
      <line x1="5" y1="18" x2="15" y2="18" stroke="#22c55e" stroke-width="2"/>
      <line x1="7" y1="21" x2="13" y2="21" stroke="#22c55e" stroke-width="1.5"/>
      <text x="25" y="12" font-size="9" fill="#86efac" font-family="sans-serif">مربط التأريض الكهربائي الإلزامي (Earth Ground)</text>
    </g>
  </g>
</svg>
