<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sectorShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sector Antenna Background (Huge 120-degree airMAX AC Sector) -->
  <g transform="translate(40, 20)">
    <path d="M 50 10 L 150 10 L 160 300 L 40 300 Z" fill="url(#sectorShade)" stroke="#64748b" stroke-width="2"/>
    <rect x="55" y="20" width="90" height="270" fill="#0f172a" rx="4"/>
    <line x1="100" y1="20" x2="100" y2="290" stroke="#38bdf8" stroke-dasharray="6,4" stroke-width="2"/>
    
    <!-- Sector RF Wave lines radiating outwards -->
    <path d="M 165 80 Q 240 100 240 160 Q 240 220 165 240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 180 50 Q 280 80 280 160 Q 280 240 180 270" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <text x="100" y="150" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 100 150)" font-family="sans-serif" font-weight="bold">airMAX 5GHz 120° 22dBi SECTOR</text>
  </g>

  <!-- Ubiquiti Rocket Prism 5AC Radio Unit (Mounted on back of sector) -->
  <g transform="translate(260, 40)">
    <!-- Die-cast metal shield -->
    <rect x="0" y="30" width="160" height="230" rx="14" fill="url(#rocketBody)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Ubiquiti U logo style -->
    <circle cx="80" cy="70" r="22" fill="#0284c7"/>
    <path d="M 72 65 C 72 80, 88 80, 88 65" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="62" r="3" fill="#ffffff"/>

    <text x="80" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14" fill="#0f172a">Rocket Prism</text>
    <text x="80" y="128" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7" font-weight="bold">5AC Gen2 (airPrism)</text>

    <!-- RF Shielding & Active Filtering badge -->
    <rect x="20" y="140" width="120" height="20" rx="3" fill="#0f172a"/>
    <text x="80" y="154" text-anchor="middle" font-size="8" fill="#38bdf8" font-family="monospace">AIRPRISM ACTIVE FILTER</text>

    <!-- Signal & Status LEDs -->
    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="100" height="40" rx="4" fill="#1e293b"/>
      <text x="10" y="14" font-size="7" fill="#94a3b8" font-family="monospace">PWR LAN GPS  SIGNAL</text>
      <!-- Power -->
      <circle cx="15" cy="26" r="3" fill="#22c55e"/>
      <!-- LAN -->
      <circle cx="33" cy="26" r="3" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="0.3s" repeatCount="indefinite"/></circle>
      <!-- GPS -->
      <circle cx="51" cy="26" r="3" fill="#38bdf8"/>
      <!-- Signal LED bar -->
      <rect x="68" y="22" width="5" height="8" fill="#22c55e"/>
      <rect x="75" y="20" width="5" height="10" fill="#22c55e"/>
      <rect x="82" y="18" width="5" height="12" fill="#22c55e"/>
      <rect x="89" y="16" width="5" height="14" fill="#22c55e"/>
    </g>

    <!-- SMA RF Connectors to Sector -->
    <rect x="35" y="10" width="14" height="22" rx="2" fill="#d97706" stroke="#b45309"/>
    <text x="42" y="5" text-anchor="middle" font-size="7" fill="#d97706" font-family="monospace">CHAIN 0</text>
    <rect x="110" y="10" width="14" height="22" rx="2" fill="#d97706" stroke="#b45309"/>
    <text x="117" y="5" text-anchor="middle" font-size="7" fill="#d97706" font-family="monospace">CHAIN 1</text>
    
    <!-- GPS Antenna Port -->
    <rect x="73" y="14" width="14" height="18" rx="2" fill="#64748b"/>
    <text x="80" y="5" text-anchor="middle" font-size="7" fill="#64748b" font-family="monospace">GPS</text>

    <!-- Weatherproof Hatch (Bottom) -->
    <path d="M 15 255 L 145 255 L 135 285 L 25 285 Z" fill="#334155" stroke="#475569"/>
    <text x="80" y="274" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">Gigabit PoE Port (24V)</text>
  </g>
</svg>
