<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%">
  <defs>
    <radialGradient id="apBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
  </defs>

  <!-- Ceiling Mount Wi-Fi 6 Access Point -->
  <g transform="translate(125, 30)">
    <!-- Outer Glow Ring (Multi-VLAN Status) -->
    <circle cx="100" cy="100" r="96" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Disk Body -->
    <circle cx="100" cy="100" r="92" fill="url(#apBody)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Central Minimalist LED Ring -->
    <circle cx="100" cy="100" r="24" fill="#0f172a"/>
    <circle cx="100" cy="100" r="18" fill="#0284c7">
      <animate attributeName="fill" values="#0284c7;#22c55e;#0284c7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="8" fill="#ffffff"/>

    <!-- Text Specs -->
    <text x="100" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#0f172a">MikroTik cAP ax</text>
    <text x="100" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#0284c7" font-weight="bold">Wi-Fi 6 (802.11ax)</text>
    <text x="100" y="173" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">AX1800 Dual-Band PoE</text>
  </g>

  <!-- Radiating Wi-Fi Waves with VLAN tags -->
  <g transform="translate(30, 240)">
    <rect x="0" y="0" width="390" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <!-- Multi-SSID Badges -->
    <rect x="15" y="8" width="105" height="24" rx="3" fill="#1e293b" stroke="#38bdf8"/>
    <text x="67" y="24" text-anchor="middle" font-size="8" fill="#38bdf8" font-family="monospace">SSID: Corp_Staff (V30)</text>

    <rect x="135" y="8" width="115" height="24" rx="3" fill="#1e293b" stroke="#a855f7"/>
    <text x="192" y="24" text-anchor="middle" font-size="8" fill="#c084fc" font-family="monospace">SSID: VoIP_Handsets (V40)</text>

    <rect x="265" y="8" width="110" height="24" rx="3" fill="#1e293b" stroke="#22c55e"/>
    <text x="320" y="24" text-anchor="middle" font-size="8" fill="#86efac" font-family="monospace">SSID: Guest_Portal (V60)</text>
  </g>
</svg>
