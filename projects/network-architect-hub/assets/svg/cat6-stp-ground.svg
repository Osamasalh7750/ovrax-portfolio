<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="100%" height="100%">
  <defs>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- CAT6 STP / FTP Cable Cutaway Diagram -->
  <g transform="translate(30, 20)">
    <!-- Layer 1: Weatherproof UV Resistant Outer Jacket (Black/Blue ToughCable) -->
    <rect x="0" y="70" width="140" height="110" rx="6" fill="url(#jacketGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="55" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="bold" font-family="sans-serif">1. الغلاف الخارجي المقاوم للشمس والحرارة (UV Jacket)</text>
    <text x="70" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" font-family="monospace">CAT6 STP</text>

    <!-- Layer 2: Braided Shield & Foil (درع القصدير والألياف) -->
    <rect x="140" y="80" width="90" height="90" fill="url(#foilGrad)" stroke="#cbd5e1"/>
    <text x="185" y="40" text-anchor="middle" font-size="10" fill="#cbd5e1" font-weight="bold" font-family="sans-serif">2. درع القصدير والألياف (Al Foil Shield)</text>
    <line x1="185" y1="45" x2="185" y2="78" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Layer 3: ESD Drain Wire (سلك التأريض وتفريغ الصواعق) -->
    <path d="M 180 80 Q 230 40 310 50" fill="none" stroke="url(#copperGrad)" stroke-width="3.5"/>
    <circle cx="310" cy="50" r="5" fill="#f59e0b"/>
    <text x="325" y="54" font-size="11" fill="#f59e0b" font-weight="bold" font-family="sans-serif">3. سلك تفريغ الشحنات الإلزامي (ESD Drain Wire)</text>
    <text x="325" y="70" font-size="9" fill="#94a3b8" font-family="sans-serif">يتم لحمه أو وصله بالغطاء المعدني لرأس RJ45</text>

    <!-- Layer 4: Twisted Pairs (4 أزواج مجدولة بدقة عالية) -->
    <g transform="translate(230, 85)">
      <!-- Pair 1: Blue / White-Blue -->
      <rect x="0" y="0" width="130" height="16" fill="#1d4ed8" rx="3"/>
      <rect x="0" y="0" width="30" height="16" fill="#ffffff" opacity="0.7"/>
      <text x="140" y="12" font-size="9" fill="#93c5fd" font-family="monospace">Pair 1 (Blue / W-Blue)</text>

      <!-- Pair 2: Orange / White-Orange -->
      <rect x="0" y="22" width="130" height="16" fill="#ea580c" rx="3"/>
      <rect x="40" y="22" width="30" height="16" fill="#ffffff" opacity="0.7"/>
      <text x="140" y="34" font-size="9" fill="#fdba74" font-family="monospace">Pair 2 (Orange / W-Orange)</text>

      <!-- Pair 3: Green / White-Green -->
      <rect x="0" y="44" width="130" height="16" fill="#16a34a" rx="3"/>
      <rect x="80" y="44" width="30" height="16" fill="#ffffff" opacity="0.7"/>
      <text x="140" y="56" font-size="9" fill="#86efac" font-family="monospace">Pair 3 (Green / W-Green)</text>

      <!-- Pair 4: Brown / White-Brown -->
      <rect x="0" y="66" width="130" height="16" fill="#78350f" rx="3"/>
      <rect x="20" y="66" width="30" height="16" fill="#ffffff" opacity="0.7"/>
      <text x="140" y="78" font-size="9" fill="#d6d3d1" font-family="monospace">Pair 4 (Brown / W-Brown)</text>
    </g>

    <!-- Shielded Metallic RJ45 Connector Plug -->
    <g transform="translate(420, 150)">
      <rect x="0" y="0" width="150" height="90" rx="8" fill="url(#foilGrad)" stroke="#e2e8f0" stroke-width="2"/>
      <text x="75" y="-10" text-anchor="middle" font-size="11" fill="#f8fafc" font-weight="bold" font-family="sans-serif">رأس RJ45 معدني مؤرض (Shielded RJ45 Plug)</text>
      
      <!-- Gold contact pins -->
      <rect x="110" y="15" width="25" height="60" fill="#020617"/>
      <line x1="115" y1="18" x2="130" y2="18" stroke="#fbbf24" stroke-width="2"/>
      <line x1="115" y1="26" x2="130" y2="26" stroke="#fbbf24" stroke-width="2"/>
      <line x1="115" y1="34" x2="130" y2="34" stroke="#fbbf24" stroke-width="2"/>
      <line x1="115" y1="42" x2="130" y2="42" stroke="#fbbf24" stroke-width="2"/>
      <line x1="115" y1="50" x2="130" y2="50" stroke="#fbbf24" stroke-width="2"/>
      <line x1="115" y1="58" x2="130" y2="58" stroke="#fbbf24" stroke-width="2"/>
      <line x1="115" y1="66" x2="130" y2="66" stroke="#fbbf24" stroke-width="2"/>

      <text x="55" y="50" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="bold" font-family="monospace">T568B STANDARD</text>
    </g>

    <!-- Engineering Warning Notice -->
    <g transform="translate(10, 260)">
      <rect x="0" y="0" width="580" height="35" rx="4" fill="#450a0a" stroke="#ef4444"/>
      <text x="290" y="22" text-anchor="middle" font-size="10" fill="#fca5a5" font-family="sans-serif" font-weight="bold">تحذير هندسي: كابلات UTP العادية في الأبراج تسبب احتراق منفذ الإيثرنت (ESD Damage) مع أول صاعقة رعدية!</text>
    </g>
  </g>
</svg>
